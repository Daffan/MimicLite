# @package task
defaults:
  - command/future_steps: short
  - observation/priv: root_body_actions
  - observation/command: joint
  - observation/command_short: joint
  - termination: booster_t1
  - motion: booster_t1/lafan
  - _self_

name: BoosterT1TrackBase
project: mimic_lite

shared:
  root_body_name: Trunk
  anchor_body_name: Trunk
  reward_root_body_name: Trunk
  termination_root_body_name: Trunk
  obs_body_names:
    - "Trunk"
    - "Waist"
    - "Shank_.*"
    - ".*_foot_link"
    - "AL3"
    - "AR3"
    - ".*_hand_link"

  tracking_body_names:
    - "Trunk"
    - "Waist"
    - "Hip_Yaw_.*"
    - "Shank_.*"
    - ".*_foot_link"
    - "AL3"
    - "AR3"
    - ".*_hand_link"
  tracking_joint_names:
    - "AAHead_yaw"
    - "Head_pitch"
    - "Waist"
    - ".*_Hip_.*"
    - ".*_Knee_Pitch"
    - ".*_Ankle_.*"
    - ".*_Shoulder_.*"
    - ".*_Elbow_.*"
  reward_joint_names:
    - "AAHead_yaw"
    - "Head_pitch"
    - "Waist"
    - ".*_Hip_.*"
    - ".*_Knee_Pitch"
    - ".*_Ankle_.*"
    - ".*_Shoulder_.*"
    - ".*_Elbow_.*"

viewer:
  resolution: [1280, 720]
  lookat: [0.0, 0.0, 0.0]
  eye: [4.0, 4.0, 4.0]

terrain: plane
enable_cameras: false

num_envs: 8192
max_episode_length: 1000

sim:
  step_dt: 0.02
  isaac_physics_dt: 0.005

robot:
  name: booster_t1

input:
  action:
    _target_: mimic_lite.JointPosition
    action_scaling:
      AAHead_yaw: 1.0
      Head_pitch: 1.0
      .*_Shoulder_.*: 1.0
      .*_Elbow_.*: 1.0
      Waist: 0.5
      .*_Hip_.*: 0.5
      .*_Knee_Pitch: 0.5
      .*_Ankle_.*: 0.5
    min_delay: 1
    max_delay: 3
    alpha_range: [0.8, 1.0]

command:
  _target_: mimic_lite.RobotTracking
  motion_cfgs: ???
  tracking_body_names: ${task.shared.tracking_body_names}
  obs_body_names: ${task.shared.obs_body_names}
  tracking_joint_names: ${task.shared.tracking_joint_names}
  diff_future_steps: [0, 1]
  root_body_name: ${task.shared.root_body_name}
  anchor_body_name: ${task.shared.anchor_body_name}

  # TODO: put this into randomization reset callbacks
  pose_range:
    x: [-0.05, 0.05]
    y: [-0.05, 0.05]
    z: [-0.01, 0.01]
    roll: [-0.1, 0.1]
    pitch: [-0.1, 0.1]
    yaw: [-0.1, 0.1]
  velocity_range:
    x: [-0.2, 0.2]
    y: [-0.2, 0.2]
    z: [-0.2, 0.2]
    roll: [-0.5, 0.5]
    pitch: [-0.5, 0.5]
    yaw: [-0.5, 0.5]

  init_joint_pos_noise: 0.1
  init_joint_vel_noise: 0.1

  # Clamp reference velocities written at reset: the retargeted dataset has
  # glitch frames (joint-vel spikes up to ~56 rad/s vs p99 ~9) that otherwise
  # inject explosive energy -> robot jumps -> instant termination.
  max_init_joint_vel: 12.0
  max_init_root_lin_vel: 4.0
  max_init_root_ang_vel: 6.0

  rewind_prob: 0.8
  rewind_steps_range: [25, 125]

observation:
  policy:
    root_ang_vel_history:
      _target_: mimic_lite.root_ang_vel_history
      history_steps: [0, 1, 2, 3, 4, 8, 16]
      noise_std: 0.2
    projected_gravity_history:
      _target_: mimic_lite.projected_gravity_history
      history_steps: [0, 1, 2, 3, 4, 8, 16]
      noise_std: 0.01
    joint_pos_history:
      _target_: mimic_lite.joint_pos_history
      history_steps: [0, 1, 2, 3, 4, 8, 16]
      noise_std: 0.02
    joint_vel_history:
      _target_: mimic_lite.joint_vel_history
      history_steps: [0, 1, 2, 3, 4, 8, 16]
      noise_std: 0.5
    prev_actions:
      _target_: mimic_lite.prev_actions
      steps: 3
  ref_joint_pos_:
    ref_joint_action:
      _target_: mimic_lite.ref_joint_action
  _motion_length:
    motion_length:
      _target_: mimic_lite.motion_length

reward:
  tracking:
    root_pos:
      _target_: mimic_lite.body_pos_exp
      body_names: ["${task.shared.reward_root_body_name}"]
      enabled: true
      weight: 0.5
      sigma: 0.3
    root_ori:
      _target_: mimic_lite.body_ori_exp
      body_names: ["${task.shared.reward_root_body_name}"]
      weight: 0.5
      sigma: 0.4
    root_linvel:
      _target_: mimic_lite.body_lin_vel_exp
      body_names: ["${task.shared.reward_root_body_name}"]
      weight: 0.5
      sigma: 1.0
    root_angvel:
      _target_: mimic_lite.body_ang_vel_exp
      body_names: ["${task.shared.reward_root_body_name}"]
      weight: 0.5
      sigma: 2.5

    body_pos:
      _target_: mimic_lite.body_pos_local_exp
      body_names: ${task.shared.tracking_body_names}
      weight: 1.0
      sigma: 0.3
    body_ori:
      _target_: mimic_lite.body_ori_local_exp
      body_names: ${task.shared.tracking_body_names}
      weight: 1.0
      sigma: 0.4

    body_linvel:
      _target_: mimic_lite.body_lin_vel_exp
      body_names: ${task.shared.tracking_body_names}
      weight: 0.5
      sigma: 1.0
    body_angvel:
      _target_: mimic_lite.body_ang_vel_exp
      body_names: ${task.shared.tracking_body_names}
      weight: 0.5
      sigma: 2.5


    joint_pos:
      _target_: mimic_lite.joint_pos_tracking_product
      joint_names: ${task.shared.reward_joint_names}
      weight: 0.5
      sigma: 0.25
    joint_vel:
      _target_: mimic_lite.joint_vel_tracking_product
      joint_names: ${task.shared.reward_joint_names}
      weight: 0.5
      sigma: 2.5

  loco:
    action_rate_l2:     {weight: 0.1, enabled: true}
    joint_vel_l2:       {weight: 1.0e-4, joint_names: .*}
    joint_pos_limits:
      _target_: mimic_lite.joint_pos_limits
      weight: 10.0
      joint_names: ".*"
      soft_factor: 0.9
      enabled: true
    self_collisions:
      _target_: mimic_lite.self_collisions
      weight: -1.0
      enabled: true
      sensor_name: self_collision
      force_threshold: 1.0

    feet_slip:
      _target_: mimic_lite.feet_slip
      weight: 0.5
      tolerance: 0.0
      enabled: false
      body_names: .*_foot_link

    feet_air_time:
      _target_: mimic_lite.feet_air_time
      # 4.0 -> 1.0 (2026-09-13): at 4.0 this dwarfed the 0.5-weight tracking
      # terms and rewards swing-foot *world height*, pushing the policy into a
      # tall straight-knee stance (measured knee 0.25 rad vs reference 0.65).
      weight: 1.0
      enabled: true
      body_names: [left_foot_link, right_foot_link]
      thres: 0.8
      height_range: [0.05, 0.15]
      time_factor_range: [0.2, 1.0]

    survival:           {weight: 4.0, enabled: true}
  tracking_metrics:
    _enabled_: false
    root_pos:
      _target_: mimic_lite.body_pos_error
      body_names: ["${task.shared.reward_root_body_name}"]
      weight: 1.0
      enabled: false
    root_ori:
      _target_: mimic_lite.body_ori_error
      body_names: ["${task.shared.reward_root_body_name}"]
      weight: 1.0
      enabled: false
    body_pos:
      _target_: mimic_lite.body_pos_error_local
      body_names: ${task.shared.tracking_body_names}
      weight: 1.0
      enabled: false
    body_ori:
      _target_: mimic_lite.body_ori_error_local
      body_names: ${task.shared.tracking_body_names}
      weight: 1.0
      enabled: false
    joint_pos:
      _target_: mimic_lite.joint_pos_error
      joint_names: ${task.shared.reward_joint_names}
      weight: 1.0
      enabled: false
  loco_metrics:
    _enabled_: false
    joint_pos_limits:
      _target_: mimic_lite.joint_pos_limits
      weight: 1.0
      joint_names: ".*"
      soft_factor: 0.9
      enabled: false

    feet_contact_count:
      _target_: mimic_lite.feet_contact_count
      weight: 1.0
      enabled: false
      body_names: .*_foot_link

    feet_contact_duration:
      _target_: mimic_lite.feet_contact_duration
      weight: 1.0
      enabled: false
      body_names: .*_foot_link

randomization:
  # startup
  perturb_body_materials:
    body_names: [".*_foot_link", ".*_hand_link"]
    static_friction_range: [0.3, 1.6]
    dynamic_friction_range: [0.3, 1.2]
    restitution_range: [0.0, 0.5]
    solref_time_constant_range: [0.015, 0.03]
    solref_dampratio_range: [0.5, 2.0]
    homogeneous: true

  perturb_body_mass:
    Trunk: [0.9, 1.1]
    Waist: [0.9, 1.1]
  perturb_body_com:
    "Trunk|Waist": [-0.03, 0.03]

  motor_params_implicit:
    stiffness_range:
      ".*(Shoulder|Elbow|Head).*": [0.9, 1.1]
      ".*(Waist|Hip|Knee|Ankle).*": [0.8, 1.2]
    damping_range:
      ".*(Shoulder|Elbow|Head).*": [0.9, 1.1]
      ".*(Waist|Hip|Knee|Ankle).*": [0.8, 1.2]
    armature_range:
      .*: [0.75, 1.25]
    friction_range:
      .*: [0.05, 0.25]


  # reset
  random_joint_offset:
    .*: [-0.01, 0.01]

  # interval
  perturb_root_vel:
    min_s: 4.0
    max_s: 6.0

    x: [-0.2, 0.2]
    y: [-0.2, 0.2]
    z: [-0.1, 0.1]
    roll: [-0.2, 0.2]
    pitch: [-0.2, 0.2]
    yaw: [-0.4, 0.4]
